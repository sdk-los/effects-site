name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    env:
      APP_VERSION: 1.1.0
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare versioned PWA build
        run: |
          mkdir _site
          cp -R css icons js .nojekyll index.html manifest.json README.md sw.js _site/
          sed -i "s/__BUILD_ID__/${GITHUB_SHA}/g" _site/sw.js
          sed -i "s/__APP_VERSION__/${APP_VERSION}/g" _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
